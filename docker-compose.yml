version: "3.8"

services:
  duckdb-etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: duckdb-etl
    volumes:
      # Optional: Mount local directories for debugging
      - ./etl/transform.sql:/app/transform.sql:ro
      - ./etl/run_etl.sh:/app/run_etl.sh:ro
    restart: "no" # Set to "always" for scheduled runs with cron

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  metabase:
    build:
      context: .
      dockerfile: Dockerfile
    image: metabase-duckdb:latest
    container_name: metabase-duckdb
    ports:
      - "3000:3000"
    environment:
      - MB_PLUGINS_DIR=/plugins
    restart: unless-stopped
