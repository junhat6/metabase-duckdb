services:
  postgres:
    image: postgres:15-alpine
    container_name: metabase-postgres
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: metabase_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  duckdb-etl:
    build:
      context: ./etl
      dockerfile: Dockerfile
    container_name: duckdb-etl
    volumes:
      # Optional: Mount local directories for debugging
      - ./etl/transform.sql:/app/transform.sql:ro
      - ./etl/run_etl.sh:/app/run_etl.sh:ro
    restart: "no" # Set to "always" for scheduled runs with cron

    # Resource limits (optional)
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  metabase:
    build:
      context: .
      dockerfile: Dockerfile
    image: metabase-duckdb:latest
    container_name: metabase-duckdb
    ports:
      - "3000:3000"
    environment:
      - MB_PLUGINS_DIR=/plugins
      - MB_DB_TYPE=postgres
      - MB_DB_DBNAME=metabase
      - MB_DB_PORT=5432
      - MB_DB_USER=metabase
      - MB_DB_PASS=metabase_password
      - MB_DB_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
